<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إعداد الاختبارات - HNUSIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary:#003366; --accent:#dda15e; --bg:#f3f6f8; --danger:#c0392b; --safe:#16854a; --ink:#1b2b3a; }
    * { box-sizing:border-box; font-family:'Tajawal',sans-serif; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); padding:28px 16px; }
    .container { max-width:850px; margin:auto; background:#fff; padding:30px; border-radius:16px; box-shadow:0 10px 35px rgba(23,47,70,.08); }
    h1 { color:var(--primary); margin-top:0; }
    .notice { background:#fff8ec; border-right:4px solid var(--accent); padding:12px 15px; line-height:1.7; }
    .form-group { margin:18px 0; }
    label { display:block; margin-bottom:6px; font-weight:700; }
    input, textarea { width:100%; padding:11px 12px; border:1px solid #d8e0e7; border-radius:8px; }
    input:focus, textarea:focus { outline:3px solid rgba(221,161,94,.3); border-color:var(--accent); }
    .grid { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; }
    .question-card { background:#f8fafb; padding:15px; border:1px solid #e4eaef; margin:10px 0; border-radius:10px; position:relative; }
    .delete-btn { position:absolute; left:12px; top:12px; border:0; background:transparent; color:var(--danger); cursor:pointer; }
    .btn { padding:11px 18px; border:0; border-radius:8px; cursor:pointer; font-weight:800; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn-add { background:#e8f0f7; color:var(--primary); }
    .btn-generate { background:var(--safe); color:#fff; width:100%; font-size:1.1rem; margin-top:20px; }
    .error { color:var(--danger); min-height:24px; }
    .success { margin-top:20px; background:#edf9f1; padding:18px; border:1px solid #b9e5c9; border-radius:10px; }
    .link { display:block; word-break:break-all; color:#1565a8; margin:10px 0; direction:ltr; text-align:left; }
    .muted { color:#627384; font-size:.9rem; }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } .container { padding:20px; } }
  </style>
</head>
<body>
  <main class="container">
    <h1>إعداد اختبار جديد</h1>
    <p class="notice"><strong>مهم:</strong> هذه اللوحة تنشئ رابطاً موقّعاً من الخادم. الأسئلة لا توضع في الرابط ولا يمكن تعديلها من الطالب، لكن يجب حماية مفتاح الإدارة وعدم مشاركته.</p>

    <div class="form-group">
      <label for="adminKey">مفتاح الإدارة</label>
      <input type="password" id="adminKey" autocomplete="off" placeholder="ADMIN_API_KEY من إعدادات الخادم">
    </div>
    <div class="grid">
      <div class="form-group"><label for="subjectName">اسم المادة</label><input id="subjectName" maxlength="200" placeholder="مثال: الذكاء الاصطناعي"></div>
      <div class="form-group"><label for="instructorName">اسم الأستاذ</label><input id="instructorName" maxlength="120" placeholder="غير محدد"></div>
      <div class="form-group"><label for="examTime">المدة بالدقائق</label><input type="number" id="examTime" value="60" min="1" max="480"></div>
    </div>
    <div class="form-group"><label for="ttlHours">صلاحية الرابط بالساعات</label><input type="number" id="ttlHours" value="72" min="1" max="720"></div>

    <h3>الأسئلة</h3>
    <div id="questionsList"></div>
    <button class="btn btn-add" type="button" onclick="addQuestion()">إضافة سؤال</button>
    <button class="btn btn-generate" id="generateButton" type="button" onclick="generateExamLink()">إنشاء رابط امتحان موقّع</button>
    <p class="error" id="errorMessage" role="alert"></p>

    <section class="success" id="linkArea" hidden>
      <strong>تم إنشاء الامتحان.</strong>
      <p class="muted" id="expiryText"></p>
      <a class="link" id="examLink" href="#" target="_blank" rel="noopener"></a>
      <button class="btn btn-add" type="button" onclick="copyLink()">نسخ الرابط</button>
    </section>
    <p class="muted" style="margin-top:30px">لا تستخدم المفتاح في كود الواجهة أو مستودع GitHub. ضعه في متغيرات البيئة على الخادم.</p>
  </main>
  <script>
    "use strict";
    const questionsList = document.getElementById("questionsList");
    const errorMessage = document.getElementById("errorMessage");
    const linkArea = document.getElementById("linkArea");
    function addQuestion() {
      const card = document.createElement("div");
      card.className = "question-card";
      const label = document.createElement("label");
      label.textContent = `نص السؤال ${questionsList.children.length + 1}`;
      const input = document.createElement("textarea");
      input.className = "question-text";
      input.rows = 3;
      input.maxLength = 2000;
      input.placeholder = "اكتب السؤال هنا...";
      const remove = document.createElement("button");
      remove.className = "delete-btn";
      remove.type = "button";
      remove.textContent = "حذف";
      remove.addEventListener("click", () => { card.remove(); renumberQuestions(); });
      card.append(label, input, remove);
      questionsList.appendChild(card);
    }
    function renumberQuestions() {
      Array.from(document.querySelectorAll(".question-card label")).forEach((label, index) => { label.textContent = `نص السؤال ${index + 1}`; });
    }
    async function generateExamLink() {
      errorMessage.textContent = "";
      linkArea.hidden = true;
      const button = document.getElementById("generateButton");
      const questions = Array.from(document.querySelectorAll(".question-text"), (input) => input.value.trim());
      const payload = {
        subject: document.getElementById("subjectName").value.trim(),
        instructor: document.getElementById("instructorName").value.trim(),
        durationMinutes: Number(document.getElementById("examTime").value),
        ttlHours: Number(document.getElementById("ttlHours").value),
        questions,
      };
      if (!payload.subject || !questions.length || questions.some((question) => !question)) {
        errorMessage.textContent = "أدخل اسم المادة وسؤالاً واحداً على الأقل، وتأكد من عدم وجود سؤال فارغ.";
        return;
      }
      if (!document.getElementById("adminKey").value) {
        errorMessage.textContent = "أدخل مفتاح الإدارة.";
        return;
      }
      button.disabled = true;
      button.textContent = "جاري الإنشاء...";
      try {
        const response = await fetch("/api/exams", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Key": document.getElementById("adminKey").value },
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "تعذر إنشاء الامتحان");
        const examUrl = `${new URL("index.html", window.location.href).href}?exam=${encodeURIComponent(data.token)}`;
        const link = document.getElementById("examLink");
        link.href = examUrl;
        link.textContent = examUrl;
        document.getElementById("expiryText").textContent = `ينتهي الرابط في: ${new Date(data.expiresAt).toLocaleString("ar-EG")}`;
        linkArea.hidden = false;
      } catch (error) {
        errorMessage.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "إنشاء رابط امتحان موقّع";
      }
    }
    async function copyLink() {
      const link = document.getElementById("examLink").textContent;
      try { await navigator.clipboard.writeText(link); alert("تم نسخ الرابط"); }
      catch { errorMessage.textContent = "تعذر النسخ تلقائياً؛ انسخ الرابط يدوياً."; }
    }
    addQuestion();
  </script>
</body>
</html>
